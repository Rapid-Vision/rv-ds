dataset:
  path: ../dataset

pipeline:
  output_dir: ../../exports

extractor:
  spec: default-seg
  options:
    class_mapping:
      - class: cube
        required_tags: [cube]
      - class: sphere
        required_tags: [sphere]
    max_polygon_points: 100

exporter:
  spec: default-preview-seg
  options:
    include_empty: true
    compare_original: true

debug:
  dump_ir: false
  fail_on_warning: false
