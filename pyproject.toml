[project]
name = "rv-ds"
version = "0.1.0"
description = "Export RV intermediate renders into YOLO datasets without re-rendering"
readme = "README.md"
authors = [{ name = "Mikhail Pankin", email = "mishapankin@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
rv-ds = "rv_ds:main"

[dependency-groups]
dev = ["mypy>=1.10", "pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
warn_unused_configs = true
packages = ["rv_ds"]
ignore_missing_imports = true
