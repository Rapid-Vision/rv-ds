dataset:
  path: /Users/mishapankin/Work/RapidVision/rv-ds/examples/dataset
pipeline:
  task: segmentation
  output_format: yolo_seg
  output_dir: exports
selection:
  scene:
    require_tags: []
    exclude_tags: []
  objects:
    target_tags: []
    include_unmapped: false
classes:
  mapping:
  - name: cube
    match:
      all_tags:
      - cube
  - name: sphere
    match:
      all_tags:
      - sphere
export:
  include_empty: false
  splits:
    train: 0.8
    val: 0.2
debug:
  dump_ir: false
  fail_on_warning: false
